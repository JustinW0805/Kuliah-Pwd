<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" 
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">

<head>
    <title>Switch-Case: Ruanf Perpustakaan</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <script type="text/javascript">
        var sInput;

        sInput = prompt("Pilih ruang: (B)aca, (D)iskusi, (K)omputer, (A)udio", "B");

        switch (sInput) {
            case "B":
                alert("Ruang baca di lantai 1");
                break;
            case "D":
                alert("Ruang diskusi di lantai 2");
                break;
            case "K":
                alert("Ruang komputer di lantai 3");
                break;
            case "A":
                alert("Ruang audio di lantai 4");
                break;
            default:
                alert("Ruang tidak ditemukan");
        }
    </script>
</head>

<body>
    <h1>Switch-Case: Ruanf Perpustakaan</h1>
    <p>Reload halaman untuk mencoba lagi.</p>
</body>

</html>
